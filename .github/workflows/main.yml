name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  run-checks:
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/checks.yml

  build:
    needs: [run-checks]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      version: ${{ github.event.release.tag_name }}
    secrets: inherit

  # Inline steps instead of the reusable workflow: this repository is public and cannot call a workflow
  # from the private Osthelia/GitOps repository.
  gitops:
    name: Bump riotrelay (staging)
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: Osthelia/GitOps
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Set tag
        env:
          IMAGE: riotrelay
          TAG: ${{ github.sha }}
          FILE: apps/staging/kustomization.yaml
        run: |
          set -euo pipefail
          grep -qE "name: ghcr\.io/osthelia/${IMAGE}," "$FILE" \
            || { echo "::error::${IMAGE} not found in ${FILE}"; exit 1; }
          sed -i -E "s#(name: ghcr\.io/osthelia/${IMAGE},[[:space:]]*newTag:)[^}]*#\1 \"${TAG}\" #" "$FILE"
          grep -E "name: ghcr\.io/osthelia/${IMAGE}," "$FILE"

      - name: Commit and push
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(staging): riotrelay -> ${TAG:0:7}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::push failed after 3 attempts"
          exit 1
