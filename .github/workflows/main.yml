name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  run-checks:
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/checks.yml

  build:
    needs: [run-checks]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      version: ${{ github.event.release.tag_name }}
    secrets: inherit

  # Staging follows main. Production is promoted by hand (a PR on apps/production in the GitOps repo).
  gitops:
    name: Bump riotrelay (staging)
    needs: [build]
    if: github.event_name == 'push'
    uses: Osthelia/GitOps/.github/workflows/bump-image.yml@main
    with:
      image: riotrelay
      tag: ${{ github.sha }}
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}